  <script>
    (() => {
      const { protocol, hostname, pathname, search, hash } = window.location;
      const isPortfolioHost = hostname === 'billyflin.dev' || hostname === 'www.billyflin.dev';
      if (isPortfolioHost && (protocol !== 'https:' || hostname !== 'billyflin.dev' || pathname.endsWith('/index.html'))) {
        const cleanPath = pathname.replace(/index\.html$/, '');
        window.location.replace(`https://billyflin.dev${cleanPath}${search}${hash}`);
      }
    })();
  </script>
